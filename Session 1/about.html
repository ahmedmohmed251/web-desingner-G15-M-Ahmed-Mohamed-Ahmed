<!DOCTYPE html>
<html>
<head></head>
<body>
    <h1>Table html</h1>
    <hr>
    <table border="3" width="70%" cellpadding="8" cellspacing="3">
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3" bgcolor="lightblue">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td bgcolor="lightyellow" rowspan="2">  8:00 a.m.</td>
                <td bgcolor="lightblue" rowspan="2">5:00 p.m.</td>
                <td>Introduction to XML</td>
            </tr>
            <tr>
                <td>Validity: DTD and Relax NG</td>
            </tr>
            <tr>
                <td rowspan="3">Tuesday</td>
                <td bgcolor="lightyellow">8:00 a.m.</td>
                <td bgcolor="lightyellow">11:00 a.m.</td>
                <td rowspan="2">XPath</td>
            </tr>
            <tr>
                <td bgcolor="lightyellow">11:00 a.m.</td>
                <td bgcolor="lightgreen">2:00 p.m.</td>
            </tr>
            <tr>
                <td bgcolor="lightgreen">2:00 p.m.</td>
                <td bgcolor="lightblue">5:00 p.m.</td>
            <td>XSL Transformations</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td bgcolor="lightyellow">8:00 a.m.</td>
                <td bgcolor="lightgreen">12:00 p.m.</td>
                <td>XSL Formatting Objects</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
